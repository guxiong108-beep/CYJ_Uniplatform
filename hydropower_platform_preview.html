<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水电站统一智能管理平台 - 静态预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:1180px;background:#08111d;color:#edf5ff;font-family:"Microsoft YaHei",system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#091522;border-right:1px solid #203047;padding:22px 16px}.brand{font-size:20px;font-weight:700;margin-bottom:20px}.brand span{display:block;color:#8fa4bf;font-size:12px;margin-top:4px}.nav button{width:100%;text-align:left;color:#b8c8da;background:transparent;border:0;border-radius:8px;padding:11px 12px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#132238;color:white}.top{height:68px;border-bottom:1px solid #203047;background:#0b1727;display:flex;align-items:center;gap:14px;padding:0 24px}.search{flex:1;background:#101f33;border:1px solid #26364c;border-radius:8px;padding:11px;color:#8fa4bf}.btn{border:1px solid #2f4966;border-radius:8px;background:#14243a;color:#eaf4ff;padding:10px 14px;cursor:pointer}.primary{background:#20c6d5;color:#06111c;font-weight:700}.main{padding:24px}.page{display:none;gap:18px}.page.active{display:grid}.title{display:flex;justify-content:space-between;align-items:center}.title span{color:#8298b3}.title h1{margin:4px 0 0;font-size:28px}.card{background:#0f1c2d;border:1px solid #26364c;border-radius:8px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kpi{display:grid;gap:8px}.kpi strong{font-size:28px}.kpi em{color:#2adf9f;font-style:normal}.status{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.status .card strong{display:block;font-size:24px;margin-top:8px}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;background:#203047}.p1{background:#4a1e2b;color:#ff91a2}.p2{background:#4d321f;color:#ffb077}.ok{background:#163a31;color:#62f0bd}.warn{background:#4a3b1d;color:#ffd779}.blue{background:#193153;color:#8fbdff}.bar{height:8px;background:#1b2a40;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#2adf9f}.bar.red i{background:#ff4d67}.table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #203047;color:#c6d6e8}th{color:#8298b3}.topology{height:520px;position:relative;background:linear-gradient(135deg,#091627,#10283c);border-radius:8px;overflow:hidden}.node{position:absolute;background:#132238;border:1px solid #34506d;border-radius:8px;padding:14px}.node small{display:block;color:#91a7c2;margin-top:4px}.node.center{left:40%;top:14%;border-color:#2adf9f}.n1{left:8%;top:52%;border-color:#ff4d67}.n2{left:36%;top:66%;border-color:#2adf9f}.n3{left:66%;top:44%;border-color:#ffc857}.n4{left:72%;top:74%;border-color:#6aa8ff}.steps{display:grid;gap:10px}.step{padding:13px;background:#132238;border:1px solid #26364c;border-radius:8px}.paper{background:#edf5ff;color:#132238;border-radius:8px;padding:24px;min-height:260px}.ai{position:fixed;right:20px;bottom:20px;width:360px;background:#0d1828;border:1px solid #2a3e58;border-radius:8px;padding:14px;box-shadow:0 20px 80px #0008;display:none}.ai.open{display:block}.ai textarea{width:100%;min-height:80px;background:#101f33;border:1px solid #26364c;color:white;border-radius:8px;padding:10px}.ai p{line-height:1.6;color:#cbd9ea}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">水电智管<span>Hydro AI Ops · 静态预览</span></div>
      <div class="nav" id="nav"></div>
    </aside>
    <section>
      <header class="top"><div class="search">搜索设备、告警、接入系统或报告</div><button class="btn primary" onclick="toggleAI()">AI 助手</button><button class="btn">通知 2</button><button class="btn">运维工程师</button></header>
      <main class="main" id="main"></main>
    </section>
  </div>
  <aside class="ai" id="ai"><h3>AI 运维助手</h3><p>当前 P1 事件根因为 #2主变35kV侧断路器操作回路断线，置信度 91%。建议优先核查端子排 X3:7 与备用跳闸回路。</p><textarea placeholder="输入问题，例如：上周哪台设备告警最多？"></textarea><br><br><button class="btn primary">发送并生成分析</button></aside>
  <script>
    const pages = {
      dashboard: ["首页总览", `<div class="title"><div><span>Dashboard</span><h1>全站核心指标与实时告警</h1></div></div><div class="status"><div class="card"><span>全站设备</span><strong>4</strong></div><div class="card"><span>在线率</span><strong>50%</strong></div><div class="card"><span>活跃告警</span><strong>2</strong></div><div class="card"><span>接入系统</span><strong>4</strong></div><div class="card"><span>今日采集</span><strong>35.9万</strong></div></div><div class="grid3">${["发电量 6,284 MWh","设备健康指数 83.6%","告警处置率 92.1%","采集成功率 98.4%","边缘在线数 3/4","根因准确率 91.7%"].map(x=>`<div class="card kpi"><span>${x.split(" ")[0]}</span><strong>${x.replace(x.split(" ")[0]+" ","")}</strong><em>趋势正常</em><div class="bar"><i style="width:82%"></i></div></div>`).join("")}</div><div class="grid2"><div class="card"><h2>全站拓扑缩略图</h2><div class="topology"><div class="node center">中心级平台<small>数据湖 · AI分析</small></div><div class="node n1">35kV变电站</div><div class="node n2">地下厂房</div><div class="node n3">坝面/库区</div><div class="node n4">施工区</div></div></div><div class="card"><h2>实时归并告警</h2><p><span class="badge p1">P1</span> 断路器操作回路断线，触发越级动作</p><p><span class="badge p2">P2</span> 坝肩渗压趋势连续偏高</p></div></div>`],
      topology: ["全站拓扑", `<div class="title"><div><span>Topology</span><h1>设备拓扑与状态可视化</h1></div></div><div class="card topology"><div class="node center">中心级平台<small>全局分析 · 策略下发</small></div><div class="node n1">#2主变35kV侧断路器<small>故障 · 58分</small></div><div class="node n2">1号水轮发电机组<small>在线 · 87分</small></div><div class="node n3">坝肩渗压监测点04<small>告警 · 78分</small></div><div class="node n4">AI摄像机12<small>在线 · 92分</small></div></div>`],
      alarm: ["告警中心", `<div class="title"><div><span>Alarm</span><h1>归并事件与处置闭环</h1></div><button class="btn">导出 CSV</button></div><div class="grid"><div class="card"><span>P1</span><strong>1</strong></div><div class="card"><span>P2</span><strong>1</strong></div><div class="card"><span>今日新增</span><strong>18</strong></div><div class="card"><span>今日关闭</span><strong>11</strong></div></div><div class="card"><table class="table"><tr><th>事件ID</th><th>级别</th><th>根因设备</th><th>归并数</th><th>状态</th></tr><tr><td>EVT-20260518-001</td><td><span class="badge p1">P1</span></td><td>#2主变35kV侧断路器</td><td>4</td><td>active</td></tr><tr><td>EVT-20260518-002</td><td><span class="badge p2">P2</span></td><td>坝肩渗压监测点04</td><td>2</td><td>processing</td></tr></table></div><div class="card"><h2>处置建议</h2><div class="steps"><div class="step">1. 现场检查端子排 X3:7 接线与辅助触点状态</div><div class="step">2. 隔离故障回路并切换备用跳闸回路</div><div class="step">3. 完成保护联跳试验后恢复运行</div></div></div>`],
      rootcause: ["根因分析", `<div class="title"><div><span>Root Cause</span><h1>AI 推理、知识图谱与处置建议</h1></div></div><div class="grid3"><div class="card"><h2>推理过程</h2><p>Step 1 收集相关告警</p><p>Step 2 关联设备状态</p><p>Step 3 拓扑路径分析</p><p>Step 4 历史缺陷匹配</p><div class="bar red"><i style="width:91%"></i></div></div><div class="card"><h2>知识图谱</h2><p>操作回路断线 → 保护跳闸失败 → 母线失压 → 馈线开关联跳</p></div><div class="card"><h2>处置建议</h2><p>生成处置工单，预计恢复 45 分钟。</p></div></div>`],
      devices: ["设备资产", `<div class="title"><div><span>Devices</span><h1>设备台账与健康状态</h1></div></div><div class="card"><table class="table"><tr><th>设备ID</th><th>设备名称</th><th>类型</th><th>区域</th><th>健康</th></tr><tr><td>CB-T2-35K</td><td>#2主变35kV侧断路器</td><td>断路器</td><td>35kV变电站</td><td>58</td></tr><tr><td>GEN-U1</td><td>1号水轮发电机组</td><td>发电机</td><td>地下主厂房</td><td>87</td></tr><tr><td>ENV-DAM-04</td><td>坝肩渗压监测点04</td><td>环境传感器</td><td>右岸坝肩</td><td>78</td></tr></table></div>`],
      integration: ["系统接入", `<div class="title"><div><span>Integration</span><h1>能力声明式接入管理</h1></div><button class="btn primary">新增接入系统</button></div><div class="grid">${["继电保护装置管理系统","旋转设备振动监测系统","AI视频分析平台","大坝安全监测系统"].map((x,i)=>`<div class="card"><span class="badge ${i<2?"ok":"blue"}">${i<2?"A":"B"}级</span><h2>${x}</h2><p>能力声明已解析 · 今日采集 ${(i+2)*42110} 次</p><div class="bar"><i style="width:${i===3?42:94}%"></i></div></div>`).join("")}</div>`],
      manifest: ["能力声明", `<div class="title"><div><span>Manifest</span><h1>能力树与字段映射</h1></div><button class="btn">AI重新提炼必要字段</button></div><div class="card"><h2>能力：getDeviceStatus</h2><p>协议 IEC61850 · 参数 deviceId,timeRange · 字段映射 operStatus → 运行状态，activePower → 有功功率</p><table class="table"><tr><th>原始字段</th><th>统一字段</th><th>必要采集</th></tr><tr><td>operStatus</td><td>运行状态</td><td><span class="badge ok">是</span></td></tr><tr><td>debugFrameCount</td><td>调试帧计数</td><td><span class="badge">否</span></td></tr></table></div>`],
      collection: ["采集策略", `<div class="title"><div><span>Collection</span><h1>最小必要数据采集策略</h1></div></div><div class="card"><table class="table"><tr><th>任务ID</th><th>目标能力</th><th>模式</th><th>频率</th><th>成功率</th></tr><tr><td>COL-001</td><td>getAlarmEvents</td><td>事件订阅</td><td>实时</td><td>99.4%</td></tr><tr><td>COL-002</td><td>getVibrationData</td><td>定时轮询</td><td>10秒</td><td>98.7%</td></tr></table></div>`],
      monitoring: ["监控意图", `<div class="title"><div><span>Monitoring Intent</span><h1>自然语言生成监控视图</h1></div><button class="btn primary">AI解析</button></div><div class="card"><p>监控地下厂房所有旋转设备的振动趋势，振动超过阈值时提前预警。</p><p>✓ 识别目标：地下厂房 → 旋转设备</p><p>✓ 识别指标：振动加速度、轴承温度</p><p>✓ 自动生成采集策略：每 10 秒采集一次</p></div>`],
      edge: ["边缘节点", `<div class="title"><div><span>Edge</span><h1>边缘自治与资源状态</h1></div></div><div class="grid">${["地下主厂房边缘节点","坝面安全监测边缘节点","变电站保护边缘节点","施工区移动接入节点"].map((x,i)=>`<div class="card"><span class="badge ${i===3?"warn":"ok"}">${i===3?"离岛":"在线"}</span><h2>${x}</h2><p>CPU ${i===3?0:40+i*8}% · 内存 ${i===3?0:58+i*4}% · 接入设备 ${24+i*44}台</p></div>`).join("")}</div>`],
      reports: ["报告中心", `<div class="title"><div><span>Reports</span><h1>AI 生成报告与订阅</h1></div><button class="btn primary">重新生成</button></div><div class="card paper"><h2>水电站今日运营简报</h2><p>今日全站发电量 6,284 MWh，采集成功率 98.4%，活跃归并告警 2 起，其中 P1 事件 1 起。</p><p>AI 建议优先处理 #2主变35kV侧断路器操作回路异常，并对坝肩渗压趋势执行现场复核。</p></div>`],
      settings: ["系统设置", `<div class="title"><div><span>Settings</span><h1>用户、权限、通知与平台参数</h1></div></div><div class="grid3"><div class="card"><h2>角色权限</h2><p>超级管理员 · 运维工程师 · 接入工程师 · 只读观察员</p></div><div class="card"><h2>通知策略</h2><p>P1/P2 告警推送，日报自动生成，Webhook 预留。</p></div><div class="card"><h2>平台参数</h2><p>实时重连 5秒，原始数据保留 30天，AI阈值 0.75。</p></div></div>`]
    };
    const nav = document.getElementById("nav"), main = document.getElementById("main");
    Object.entries(pages).forEach(([key,[label]])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>show(key);nav.appendChild(b)});
    function show(key){[...nav.children].forEach((b,i)=>b.classList.toggle("active",Object.keys(pages)[i]===key));main.innerHTML=`<section class="page active">${pages[key][1]}</section>`}
    function toggleAI(){document.getElementById("ai").classList.toggle("open")}
    show("dashboard");
  </script>
</body>
</html>
